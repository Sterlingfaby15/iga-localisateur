<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📍 Localisateur Produits IGA</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

:root{
    --iga-red:#d71920;
    --bg:#f2f4f7;
    --card:#ffffff;
    --text:#111111;
    --muted:#666666;
}

.dark{
    --bg:#121212;
    --card:#1f1f1f;
    --text:#ffffff;
    --muted:#bdbdbd;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    color:#d71920;
    margin-bottom:15px;
}

.orientation-info{
    background:var(--card);
    color:var(--text);
    border-left:6px solid #d71920;
    border-radius:16px;
    padding:15px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    font-weight:700;
}

.search-box{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:16px;
    background:var(--card);
    color:var(--text);
    font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    border:none;
    padding:16px;
    border-radius:16px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn{
    background:#0d6efd;
}

.scan-btn{
    background:#198754;
}

.stop-btn{
    background:#444;
}

.theme-btn{
    background:#d71920;
}

.card{
    background:var(--card);
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 10px;
    color:var(--text);
    font-size:22px;
}

.marque{
    color:var(--muted);
    margin-bottom:8px;
}

.categorie{
    display:inline-block;
    background:#ececec;
    color:black;
    padding:6px 12px;
    border-radius:999px;
    font-size:14px;
    font-weight:bold;
    margin-bottom:12px;
}

.loc{
    background:#d71920;
    color:white;
    border-radius:16px;
    text-align:center;
    padding:16px;
    margin-top:10px;
    font-size:30px;
    font-weight:900;
}

.tablette{
    background:var(--bg);
    color:var(--text);
    text-align:center;
    border-radius:16px;
    padding:14px;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.upc{
    margin-top:12px;
    color:var(--muted);
}

#reader{
    margin-top:15px;
    margin-bottom:15px;
}

@media(max-width:700px){

    .search-box{
        flex-wrap:wrap;
    }

    button{
        flex:1;
    }

    .loc{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>📍 Localisateur Produits IGA</h1>

<div class="orientation-info">

⬅️ Gauche | Droite ➡️

<br><br>

Les côtés sont toujours indiqués à partir du devant du magasin.

</div>

<div class="search-box">

<input
id="search"
type="text"
placeholder="Nom, UPC, Marque..."
onkeyup="searchProduct()">

<button
class="search-btn"
onclick="searchProduct()">
🔍
</button>

<button
class="scan-btn"
onclick="startScanner()">
📷
</button>

<button
id="stopBtn"
class="stop-btn"
style="display:none"
onclick="stopScanner()">
🛑
</button>

<button
class="theme-btn"
onclick="toggleTheme()">
🌙
</button>

</div>

<div id="reader"></div>

<div id="results"></div>

</div>

<script src="app.js"></script>

</body>

</html>
