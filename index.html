<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Localisateur Produits IGA</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
    background:#f2f4f7;
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    color:#d71920;
    font-size:30px;
}

.orientation-info{
    background:white;
    border-left:6px solid #d71920;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    text-align:center;
    font-weight:700;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:16px;
    font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    background:#d71920;
    color:white;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:18px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 10px 0;
    font-size:22px;
    color:#111;
}

.marque{
    color:#666;
    margin-bottom:8px;
}

.categorie{
    display:inline-block;
    background:#eef1f4;
    border-radius:50px;
    padding:6px 12px;
    margin-bottom:15px;
    font-weight:600;
}

.loc{
    background:#d71920;
    color:white;
    text-align:center;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
    font-size:30px;
    font-weight:900;
}

.tablette{
    background:#f5f5f5;
    text-align:center;
    border-radius:14px;
    padding:12px;
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.upc{
    margin-top:12px;
    color:#666;
    font-size:14px;
}

#reader{
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>📍 Localisateur Produits IGA</h1>

<div class="orientation-info">

🚪 Entrée principale du magasin

<br><br>

⬅️ Gauche | Droite ➡️

<br><br>

Les côtés sont toujours indiqués à partir du devant du magasin.

</div>

<div class="search-box">

<input
id="search"
type="text"
placeholder="Nom, UPC, marque..."
onkeyup="searchProduct()">

<button onclick="startScanner()">
📷
</button>

</div>

<div id="reader"></div>

<div id="results"></div>

</div>

<script src="app.js"></script>

</body>

</html>
