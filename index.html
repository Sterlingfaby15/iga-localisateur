<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Localisateur Produits IGA</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#cc0000;
}

.orientation-info{
    background:#fff3cd;
    border:2px solid #ffe69c;
    color:#856404;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:18px;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#cc0000;
    color:white;
    font-size:18px;
    font-weight:bold;
}

button:hover{
    cursor:pointer;
    opacity:0.9;
}

#reader{
    margin-top:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h3{
    margin-top:0;
    color:#cc0000;
}

.loc{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.tablette{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.info{
    margin-top:5px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:8px;
    background:#eee;
    margin-right:5px;
    margin-top:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>📍 Localisateur Produits IGA</h1>

<div class="orientation-info">

🚪 Entrée principale du magasin

<br><br>

⬅️ Gauche | Droite ➡️

<br><br>

Les côtés sont toujours indiqués en regardant depuis l'entrée principale du magasin.

</div>

<div class="search-box">

<input
id="search"
type="text"
placeholder="Nom du produit ou UPC"
onkeyup="searchProduct()">

<button onclick="startScanner()">

📷 Scanner

</button>

</div>

<div id="reader"></div>

<div id="results"></div>

</div>

<script src="app.js"></script>

</body>

</html>
